<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Lilita One';src:url('node_modules/@fontsource/lilita-one/files/lilita-one-latin-400-normal.woff2') format('woff2');}
@font-face{font-family:'Nunito';font-weight:800;src:url('node_modules/@fontsource/nunito/files/nunito-latin-800-normal.woff2') format('woff2');}
html,body{margin:0;background:#000;overflow:hidden}
</style></head>
<body>
<svg id="root" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="lib.js"></script>
<script src="helpers.js"></script>
<script>
const T={c0:0.4,c1:13.6,c2:26.9,c3:34.8,c4:40.4,c5:48.4,end:58.6};
const S=[[0,13.3],[13.3,26.5],[26.5,34.4],[34.4,48.0],[48.0,58.6]];
const DEX={type:'hoodie',top:'#FFC21F',hood:true,hair:'dex',pants:'#1F2033',stripe:true};
function fmt(n){return Math.round(n).toLocaleString('en-GB');}
function engine(x,y,s,on,t,i){const fl=on?(0.7+0.3*Math.sin(t*40+i)):0;
  return `<g transform="translate(${x},${y}) scale(${s})"><rect x="-60" y="-50" width="120" height="100" rx="14" fill="${on?'#8C93B8':'#C9C2DA'}" stroke="${INK}" stroke-width="6"/>
  ${[-36,-12,12,36].map(cx=>`<rect x="${cx-9}" y="-74" width="18" height="30" rx="5" fill="${on?'#6A7099':'#B4ADC8'}" stroke="${INK}" stroke-width="4"/>`).join('')}
  <rect x="-44" y="-26" width="88" height="40" rx="8" fill="${on?'#FFC21F':'#E6E1F0'}" stroke="${INK}" stroke-width="4"/>
  ${on?`<path d="M-70,10 q-${40*fl},-14 -${70*fl},0 q${30*fl},14 ${70*fl},0 Z" fill="#FF8A3D" stroke="${INK}" stroke-width="3"/><path d="M-70,10 q-${24*fl},-7 -${40*fl},0 q${18*fl},7 ${40*fl},0 Z" fill="#FFE27A"/>`:''}</g>`;}

// S1: 11 MW = 15 F1 engines
function s1(t){
  let s=bgPanel('#1B2A6B','#2A3D8F')+rays(t,'#24357F',0.6);
  // treadmill strip with Dex
  s+=`<rect x="80" y="860" width="760" height="40" rx="20" fill="#3A3F66" stroke="${INK}" stroke-width="6"/>`;
  for(let i=0;i<12;i++){const x=((i*70-t*900)%840+840)%840+80; if(x<820) s+=`<rect x="${x}" y="870" width="30" height="20" rx="6" fill="#5A6199"/>`;}
  s+=`<g filter="url(#glow)">${[0,1,2].map(j=>`<path d="M80,${660+j*50} L360,${660+j*50}" stroke="#7FD3FF" stroke-width="${12-j*3}" stroke-linecap="round" opacity=".7"/>`).join('')}</g>`;
  s+=chibiSide({x:520,y:860,s:1.3,phase:(t*3.2)%1,t,expr:'determined',lean:24,wind:1});
  // engines grid lighting up one by one
  const n=Math.floor(clamp((t-(T.c0+6.4))/2.6)*15+0.0001)+(t>T.c0+6.4?1:0);
  for(let i=0;i<15;i++){const r=Math.floor(i/5), c=i%5; s+=engine(1080+c*160,330+r*170,1,i<n,t,i);}
  const watts=11e6*easeOut(seg(t,T.c0+3.0,T.c0+5.6));
  s+=`<g transform="translate(1400,140) scale(${pop(t,T.c0+2.6,0.4)})">${txt(fmt(watts)+' W',0,30,84,'#FFC21F')}</g>`;
  if(n>=15) s+=`<g transform="translate(1400,880) scale(${pop(t,T.c0+9.2,0.4)})">${chip('= 15 F1 ENGINES, FLAT OUT',0,0,'#E8463C',42)}</g>`;
  s+=`<g transform="translate(460,160) scale(${pop(t,T.c0+0.6,0.4)})">${chip('POWER TO PUSH THE AIR',0,0,'#3D8BFF',40)}</g>`;
  return s;}

// S2: calories
function s2(t){
  let s=bgPanel('#FFF4D6','#FFE2A8');
  const growl=t>T.c1+9.0?Math.sin(t*40)*4*seg(t,T.c1+9.0,T.c1+9.4):0;
  s+=`<g transform="translate(${growl},0)">${chibi({x:420,y:1000,s:1.6,...DEX,eyes:t>T.c1+9.2?'wide':'open',mouth:t>T.c1+9.2?'o':'smile',sweat:t>T.c1+10,armF:[-20,10],armB:[20,-10],look:[8,0]})}</g>`;
  if(t>T.c1+9.2){for(let i=0;i<3;i++){const k=seg(t,T.c1+9.2+i*0.15,T.c1+9.8+i*0.15); s+=`<path d="M${330+i*10},${740} q-${40+i*20},${-30-i*10} -${60+i*30},0" fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round" opacity="${k*(1-seg(t,T.c1+11,T.c1+12))}"/>`;}
    s+=`<g transform="translate(250,560) scale(${pop(t,T.c1+9.3,0.3)}) rotate(-10)">${txt('GRRRUMBLE',0,0,64,'#FF8A3D')}</g>`;}
  // efficiency pie
  const pk=pop(t,T.c1+2.6,0.45);
  const pie=(cx,cy,r,f)=>{const a=rad(-90+360*f); const x=cx+r*Math.cos(a), y=cy+r*Math.sin(a); return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#FF8A3D" stroke="${INK}" stroke-width="8"/><path d="M${cx},${cy} L${cx},${cy-r} A${r},${r} 0 ${f>0.5?1:0} 1 ${x},${y} Z" fill="#3D8BFF" stroke="${INK}" stroke-width="8" stroke-linejoin="round"/>`;};
  s+=`<g transform="translate(1000,380) scale(${pk})">${pie(0,0,150,0.25*easeOut(seg(t,T.c1+3.0,T.c1+4.0)))}<text x="70" y="-60" font-family="Lilita One" font-size="40" fill="#fff">25%</text><text x="-110" y="70" font-family="Lilita One" font-size="40" fill="#fff">75%</text></g>`;
  s+=`<g transform="translate(1000,600) scale(${pk})">${chip('MUSCLES ≈ 25% EFFICIENT',0,0,'#3D8BFF',36)}</g>`;
  // calorie counter
  const kc=630000*Math.pow(seg(t,T.c1+5.5,T.c1+9.5),1.5);
  s+=`<g transform="translate(1500,350) scale(${pop(t,T.c1+5.2,0.4)})"><rect x="-260" y="-110" width="520" height="210" rx="30" fill="${INK}"/><rect x="-245" y="-95" width="490" height="180" rx="22" fill="#2B2F4A"/>
  <text y="22" text-anchor="middle" font-family="Lilita One" font-size="96" fill="#7ED957">${fmt(kc)}</text><text y="140" text-anchor="middle" font-family="Lilita One" font-size="44" fill="${INK}">CALORIES / MINUTE</text></g>`;
  if(t>T.c1+9.5) s+=`<g transform="translate(1500,700) scale(${pop(t,T.c1+9.5,0.35)}) rotate(-4)">${txt('1 MINUTE!',0,0,90,'#E8463C')}</g>`;
  return s;}

// S3: kitchen + calendar
function s3(t){
  let s=bgPanel('#FFE9C9','#FFD9A8');
  s+=`<rect y="760" width="1920" height="320" fill="#C98A5B" stroke="${INK}" stroke-width="6"/>`;
  for(let i=0;i<12;i++) s+=`<rect x="${i*170}" y="760" width="168" height="40" fill="#B5784B" stroke="${INK}" stroke-width="3"/>`;
  // fridge (open, empty)
  const open=seg(t,T.c2+0.2,T.c2+0.6);
  s+=`<rect x="1450" y="230" width="330" height="540" rx="24" fill="#EAF6FF" stroke="${INK}" stroke-width="8"/><rect x="1470" y="250" width="290" height="500" rx="14" fill="#CFE6FF"/>`;
  for(let r=0;r<3;r++) s+=`<rect x="1470" y="${400+r*120}" width="290" height="10" fill="#9DB9E8"/>`;
  s+=`<g transform="translate(1450,230) scale(${1-open*0.85},1)"><rect x="0" y="0" width="330" height="540" rx="24" fill="#F7FBFF" stroke="${INK}" stroke-width="8"/><rect x="290" y="200" width="16" height="120" rx="8" fill="#9DB9E8" stroke="${INK}" stroke-width="4"/></g>`;
  s+=`<text x="1615" y="520" text-anchor="middle" font-family="Lilita One" font-size="40" fill="#7A84AA" opacity="${open}">EMPTY</text>`;
  // plate tower
  const plates=Math.floor(seg(t,T.c2+0.5,T.c2+3.5)*22);
  for(let i=0;i<plates;i++) s+=`<ellipse cx="${700+Math.sin(i*1.7)*8}" cy="${760-i*22}" rx="120" ry="20" fill="#FFFFFF" stroke="${INK}" stroke-width="5"/>`;
  // blur dex zipping
  const zx=lerp(200,1300,(t*3)%1);
  s+=`<g opacity=".9">${chibiSide({x:zx,y:900,s:1.0,phase:(t*5)%1,t,expr:'determined',lean:24,wind:1})}</g><g filter="url(#glow)"><path d="M${zx-500},700 L${zx-80},700 M${zx-420},760 L${zx-80},760" stroke="#7FD3FF" stroke-width="10" stroke-linecap="round" opacity=".6"/></g>`;
  // calendar flipping
  const days=Math.floor(315*easeOut(seg(t,T.c2+3.4,T.c2+6.2)));
  s+=`<g transform="translate(330,330) scale(${pop(t,T.c2+3.2,0.4)})"><rect x="-180" y="-170" width="360" height="340" rx="26" fill="#fff" stroke="${INK}" stroke-width="9"/><path d="M-180,-110 L180,-110 L180,-144 Q180,-170 154,-170 L-154,-170 Q-180,-170 -180,-144 Z" fill="#E8463C" stroke="${INK}" stroke-width="9"/>
  <text y="-122" text-anchor="middle" font-family="Lilita One" font-size="44" fill="#fff">DAYS OF FOOD</text><text y="70" text-anchor="middle" font-family="Lilita One" font-size="150" fill="${INK}">${days}</text></g>`;
  for(let i=0;i<4;i++){const k=((t*4+i/4)%1); if(t>T.c2+3.4&&t<T.c2+6.2) s+=`<rect x="${470+k*300}" y="${200-k*160}" width="100" height="92" rx="10" fill="#fff" stroke="${INK}" stroke-width="5" transform="rotate(${k*140},${520+k*300},${246-k*160})" opacity="${1-k}"/>`;}
  if(t>T.c2+6.2) s+=`<g transform="translate(960,140) scale(${pop(t,T.c2+6.2,0.35)})">${chip('≈ 1 YEAR OF FOOD / MINUTE',0,0,'#E8463C',46)}</g>`;
  return s;}

// S4: heat — pie then thermometer + kettles
function s4(t){
  let s=bgPanel('#FFD6B0','#FF9F80');
  const heatK=seg(t,T.c4,T.c4+3.5);
  // pie (75% heat) during c3
  if(t<T.c4+0.3){const k=pop(t,T.c3+0.4,0.45); const f=0.75*easeOut(seg(t,T.c3+1.2,T.c3+3.2)); const a=rad(-90+360*f); const x=170*Math.cos(a), y=170*Math.sin(a);
    s+=`<g transform="translate(1340,470) scale(${k*(1-seg(t,T.c4,T.c4+0.3))})"><circle r="170" fill="#3D8BFF" stroke="${INK}" stroke-width="9"/><path d="M0,0 L0,-170 A170,170 0 ${f>0.5?1:0} 1 ${x},${y} Z" fill="#FF5A3C" stroke="${INK}" stroke-width="9" stroke-linejoin="round"/>
    <text x="-80" y="40" text-anchor="middle" font-family="Lilita One" font-size="52" fill="#fff">HEAT</text><text x="90" y="-80" text-anchor="middle" font-family="Lilita One" font-size="36" fill="#fff">MOVE</text></g>`;
    s+=`<g transform="translate(1340,740) scale(${pop(t,T.c3+3.4,0.35)})">${chip('75% → HEAT',0,0,'#E8463C',48)}</g>`;}
  // Dex overheating
  const red=heatK;
  s+=`<g>${chibi({x:520,y:1010,s:1.6,...DEX,eyes:red>0.5?'closed':'open',mouth:red>0.5?'yawn':'o',sweat:true,armF:[lerp(-20,150,seg(t,T.c4+2,T.c4+2.4)),lerp(10,40,seg(t,T.c4+2,T.c4+2.4))+Math.sin(t*18)*20*seg(t,T.c4+2,T.c4+2.4)],armLen:1.3,armB:[20,-10],tilt:Math.sin(t*6)*3*red})}</g>`;
  s+=`<ellipse cx="520" cy="620" rx="${150}" ry="${140}" fill="#FF3B2F" opacity="${0.28*red}"/>`;
  for(let i=0;i<5;i++){const k=((t*0.8+i/5)%1); if(red>0.2) s+=`<path d="M${420+i*50},${560-k*240} q20,-30 0,-60 q-20,-30 0,-60" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity="${(1-k)*0.8*red}"/>`;}
  // thermometer
  if(t>T.c4-0.2){const lvl=Math.min(1.25,heatK*1.25); const burst=lvl>1.05;
    s+=`<g transform="translate(980,560) scale(${pop(t,T.c4-0.2,0.4)})"><rect x="-40" y="-380" width="80" height="460" rx="40" fill="#fff" stroke="${INK}" stroke-width="9"/><circle cx="0" cy="120" r="80" fill="#FF3B2F" stroke="${INK}" stroke-width="9"/>
    <rect x="-20" y="${80-Math.min(1,lvl)*440}" width="40" height="${Math.min(1,lvl)*440+40}" fill="#FF3B2F"/>
    ${burst?`<g transform="translate(0,-400)">${[0,1,2,3,4,5,6,7].map(i=>{const a=rad(i*45);return `<line x1="${Math.cos(a)*30}" y1="${Math.sin(a)*30}" x2="${Math.cos(a)*110}" y2="${Math.sin(a)*110}" stroke="#FF3B2F" stroke-width="12" stroke-linecap="round"/>`;}).join('')}</g>`:''}</g>`;}
  // ten kettles
  if(t>T.c4+3.6){for(let i=0;i<10;i++){const k=pop(t,T.c4+3.6+i*0.12,0.3); const x=1250+(i%5)*135, y=360+Math.floor(i/5)*200;
    s+=`<g transform="translate(${x},${y}) scale(${k*0.9})"><path d="M-44,40 L-50,-20 Q-50,-50 0,-52 Q50,-50 50,-20 L44,40 Z" fill="#F2F2F2" stroke="${INK}" stroke-width="6"/><path d="M50,-10 L80,-30" stroke="${INK}" stroke-width="10" stroke-linecap="round"/><rect x="-16" y="-66" width="32" height="14" rx="6" fill="${INK}"/>
    <path d="M80,-40 q10,-20 0,-40 q-10,-20 0,-40" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity="${0.5+0.5*Math.sin(t*6+i)}"/></g>`;}
    s+=`<g transform="translate(1520,780) scale(${pop(t,T.c4+5.0,0.35)})">${chip('BOIL HIM AWAY ×10',0,0,'#E8463C',46)}</g>`;}
  return s;}

// S5: rule two
function s5(t){
  let s=bgPanel('#5DB6FF','#C9E9FF');
  s+=`<rect y="760" width="1920" height="320" fill="#86D17C" stroke="${INK}" stroke-width="5"/>`;
  // power station
  const pk=pop(t,T.c5+2.2,0.45);
  s+=`<g transform="translate(1420,760) scale(${pk})">${[-160,40].map(x=>`<path d="M${x},0 L${x+30},-300 Q${x+60},-330 ${x+90},-300 L${x+120},0 Z" fill="#D8D2E6" stroke="${INK}" stroke-width="8"/>`).join('')}
   <rect x="160" y="-200" width="200" height="200" fill="#C9C2DA" stroke="${INK}" stroke-width="8"/>
   ${[0,1,2].map(i=>{const k=((t*0.5+i/3)%1);return `<circle cx="${-100+((i%2)*200)}" cy="${-330-k*200}" r="${40+k*60}" fill="#fff" opacity="${0.8*(1-k)}"/>`;}).join('')}</g>`;
  s+=`<g transform="translate(1420,250) scale(${pk})">${chip('A POWER STATION OF HEAT',0,0,'#E8463C',40)}</g>`;
  // Dex with ice pack, looking defeated
  s+=chibi({x:640,y:1000,s:1.5,...DEX,eyes:'closed',mouth:'flat',sweat:true,armF:[160,30],armLen:1.3,armB:[20,-10],tilt:-6});
  s+=`<g transform="translate(700,560) rotate(-15)"><rect x="-70" y="-30" width="140" height="60" rx="20" fill="#9FD8FF" stroke="${INK}" stroke-width="6"/><text y="12" text-anchor="middle" font-family="Lilita One" font-size="30" fill="#fff">ICE</text></g>`;
  const nk=pop(t,T.c5+0.4,0.35);
  s+=`<g transform="translate(560,250) scale(${nk}) rotate(4)"><rect x="-280" y="-150" width="560" height="300" fill="#FFF07A" stroke="${INK}" stroke-width="7"/><rect x="-70" y="-176" width="140" height="44" fill="#BFE6FF" opacity=".85" transform="rotate(4)"/>
   <text y="-50" text-anchor="middle" font-family="Lilita One" font-size="64" fill="#E8463C">RULE 2</text><text y="30" text-anchor="middle" font-family="Lilita One" font-size="52" fill="${INK}">DON'T COOK</text><text y="92" text-anchor="middle" font-family="Lilita One" font-size="52" fill="${INK}">YOURSELF</text></g>`;
  if(t>T.c5+7.0) s+=`<g transform="translate(960,960) scale(${pop(t,T.c5+7.0,0.35)})">${txt('...YOU CAN’T',0,0,80,'#FFFFFF')}</g>`;
  return s;}

function render(t){
  let s=DEFS; const F=[s1,s2,s3,s4,s5];
  for(let i=0;i<S.length;i++){ if(t<S[i][1]||i===S.length-1){ s+=F[i](t); break; } }
  for(let i=0;i<S.length-1;i++) s+=wipe(t,S[i][1]);
  const fi=1-seg(t,0,0.3); if(fi>0) s+=`<rect width="1920" height="1080" fill="#000" opacity="${fi}"/>`;
  const fo=seg(t,T.end-0.5,T.end); if(fo>0) s+=`<rect width="1920" height="1080" fill="#000" opacity="${fo}"/>`;
  document.getElementById('root').innerHTML=s;
}
window.render=render; render(0);
</script></body></html>
