<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Lilita One';src:url('node_modules/@fontsource/lilita-one/files/lilita-one-latin-400-normal.woff2') format('woff2');}
@font-face{font-family:'Nunito';font-weight:800;src:url('node_modules/@fontsource/nunito/files/nunito-latin-800-normal.woff2') format('woff2');}
html,body{margin:0;background:#000;overflow:hidden}
</style></head>
<body>
<svg id="root" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="lib.js"></script>
<script src="helpers.js"></script>
<script>
const T={b0:0.4,b1:8.2,b2:19.0,b3:28.4,b4:40.0,b5:43.4,b6:46.6,b7:58.6,b8:62.3,b9:69.8,end:75.6};
const S=[[0,7.9],[7.9,18.6],[18.6,28.0],[28.0,46.2],[46.2,58.2],[58.2,69.4],[69.4,75.6]];
const DEX={type:'hoodie',top:'#FFC21F',hood:true,hair:'dex',pants:'#1F2033',stripe:true};
function streetBG(scroll){
  let s=bgPanel('#5DB6FF','#C9E9FF');
  s+=`<g transform="translate(${-(scroll*0.3)%2000},0)">${bgFar()}<g transform="translate(2000,0)">${bgFar()}</g></g>`;
  s+=`<rect x="0" y="700" width="1920" height="230" fill="#E6E1F0" stroke="${INK}" stroke-width="5"/>`;
  for(let i=0;i<16;i++){const x=((i*160-scroll)%2560+2560)%2560-320; s+=`<path d="M${x},700 L${x-40},930" stroke="#CFC8E0" stroke-width="4"/>`;}
  s+=`<rect x="0" y="930" width="1920" height="20" fill="#B9B2CC" stroke="${INK}" stroke-width="5"/><rect x="0" y="950" width="1920" height="200" fill="url(#road)"/>`;
  for(let i=0;i<10;i++){const x=((i*240-scroll*1.2)%2400+2400)%2400-240; s+=`<rect x="${x}" y="1030" width="120" height="14" rx="7" fill="#F2F2F2" opacity=".8"/>`;}
  return s;}
function car(x,y,s,col,flip=false){return `<g transform="translate(${x},${y}) scale(${flip?-s:s},${s})">
  <ellipse cx="0" cy="8" rx="150" ry="14" fill="#000" opacity=".18"/>
  <path d="M-150,-20 Q-150,-70 -110,-74 L-70,-76 Q-40,-130 20,-130 L60,-130 Q100,-128 120,-80 L140,-76 Q160,-70 160,-30 L160,-12 Q160,0 148,0 L-140,0 Q-150,0 -150,-12 Z" fill="${col}" stroke="${INK}" stroke-width="7" stroke-linejoin="round"/>
  <path d="M-56,-80 Q-34,-118 10,-118 L10,-80 Z M26,-80 L26,-118 L56,-118 Q88,-116 104,-80 Z" fill="#CFEFFF" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>
  <path d="M-36,-84 L-16,-112" stroke="#fff" stroke-width="7" opacity=".9"/>
  <rect x="140" y="-56" width="20" height="14" rx="5" fill="#FFF1B0" stroke="${INK}" stroke-width="4"/>
  ${[-92,96].map(wx=>`<circle cx="${wx}" cy="-2" r="32" fill="#2B2F4A" stroke="${INK}" stroke-width="6"/><circle cx="${wx}" cy="-2" r="13" fill="#C9C2DA" stroke="${INK}" stroke-width="4"/>`).join('')}
  <path d="M-150,-34 L160,-34" stroke="#000" stroke-width="4" opacity=".12"/></g>`;}

// S1: the air has other plans
function s1(t){
  const sc=t*1800; let s=streetBG(sc);
  for(let j=0;j<7;j++){const yy=520+j*55, x0=((j*377-t*2600)%2400+2400)%2400-400; s+=`<path d="M${x0},${yy} l${300+j*40},0" stroke="#fff" stroke-width="${8-j*0.6}" stroke-linecap="round" opacity=".75"/>`;}
  const fight=seg(t,T.b0+4.6,T.b0+6.2);
  const lean=lerp(18,32,fight);
  s+=`<g filter="url(#glow)">${[0,1,2,3].map(j=>`<path d="M${-100},${640+j*42} L${740},${640+j*42}" stroke="#7FD3FF" stroke-width="${12-j*2}" stroke-linecap="round" opacity=".7"/>`).join('')}</g>`;
  s+=chibiSide({x:900+Math.sin(t*30)*fight*6,y:905,s:1.35,phase:(t*3.2)%1,t,expr:'determined',lean,wind:1+fight});
  const wv=lerp(20,100,easeOut(seg(t,T.b0+4.3,T.b0+6.0)));
  s+=gauge(1600,260,150,wv,100,'WIND',wv>70?'#E8463C':'#3D8BFF');
  if(fight>0.3) s+=`<g transform="translate(1600,470) scale(${pop(t,T.b0+5.5,0.3)})">${chip('AIR RESISTANCE',0,0,'#E8463C',40)}</g>`;
  return s;}

// S2: double speed -> 4x force -> 8x power
function s2(t){
  const t0=S[1][0]; let s=bgPanel('#FFF4D6','#FFE2A8');
  const cols=[['SPEED','×2',2,'#3D8BFF',T.b1+2.0],['AIR FORCE','×4',4,'#FF8A3D',T.b1+4.0],['POWER NEEDED','×8',8,'#E8463C',T.b1+7.0]];
  cols.forEach((c,i)=>{const x=420+i*540, base=880; const k=pop(t,c[4]-0.6,0.5);
    s+=`<g opacity="${clamp(k*2)}">`;
    // before bar (1 unit) and after bar (n units)
    const unit=70; const grow=easeOut(seg(t,c[4],c[4]+0.8));
    s+=`<rect x="${x-150}" y="${base-unit}" width="110" height="${unit}" rx="12" fill="#C9C2DA" stroke="${INK}" stroke-width="6"/>`;
    const h=unit*lerp(1,c[2],grow); s+=`<rect x="${x+10}" y="${base-h}" width="140" height="${h}" rx="14" fill="${c[3]}" stroke="${INK}" stroke-width="7"/>`;
    s+=`<rect x="${x+24}" y="${base-h+12}" width="22" height="${Math.max(0,h-24)}" rx="8" fill="#fff" opacity=".35"/>`;
    if(grow>0.95) s+=`<g transform="translate(${x+80},${base-h-60}) scale(${pop(t,c[4]+0.8,0.3)})">${txt(c[1],0,0,96,'#FFFFFF')}</g>`;
    s+=`<text x="${x}" y="${base+70}" text-anchor="middle" font-family="Lilita One" font-size="48" fill="${INK}">${c[0]}</text></g>`;
    if(i<2&&t>cols[i+1][4]-0.6) s+=`<text x="${x+270}" y="${base-200}" text-anchor="middle" font-family="Lilita One" font-size="120" fill="${INK}" opacity="${seg(t,cols[i+1][4]-0.6,cols[i+1][4]-0.2)}">→</text>`;});
  s+=`<g transform="translate(960,110) scale(${pop(t,t0+0.3,0.4)})">${chip('AIR RESISTANCE ISN’T A STRAIGHT LINE',0,0,'#3D8BFF',44)}</g>`;
  s+=`<g transform="translate(1720,300) scale(0.8)">${chibi({x:0,y:0,s:1,...DEX,eyes:t>T.b1+7.2?'wide':'open',mouth:t>T.b1+7.2?'o':'smile',sweat:t>T.b1+7.5,armF:[-20,10],armB:[20,-10],look:[-8,4]})}</g>`;
  return s;}

// S3: pushing three cars
function s3(t){
  const t0=S[2][0]; const sc=t*260; let s=streetBG(sc);
  const strain=Math.sin(t*22)*4;
  for(let j=0;j<8;j++){const yy=480+j*55, x0=((j*311+t*2200)%2600)-400; s+=`<path d="M${x0},${yy} l${-260-j*30},0" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".7"/>`;}
  const ck=easeOut(seg(t,T.b2+5.8,T.b2+6.6));
  const carsX=lerp(2600,1260,ck);
  // 3 stacked cars pressing back on Dex
  if(ck>0){s+=car(carsX+1000,930,1.6,'#3D8BFF',true)+car(carsX+500,930,1.6,'#7ED957',true)+car(carsX,930,1.6,'#E8463C',true);}
  const dx=ck>0?carsX-330+strain:900;
  s+=chibiSide({x:dx,y:905,s:1.35,phase:(t*(ck>0?1.6:3.2))%1,t,expr:'determined',lean:ck>0?34:20,wind:1.6});
  if(ck>0.8){for(let i=0;i<5;i++){const px=dx-60-i*50; s+=`<circle cx="${px}" cy="${930-((t*300+i*40)%60)}" r="${10+i*4}" fill="#fff" opacity="${0.6-i*0.1}"/>`;}
    s+=`<g transform="translate(${dx+40},560)">${txt('!!',0,0,90,'#E8463C')}</g>`;}
  s+=`<g transform="translate(1500,170) scale(${pop(t,T.b2+2.2,0.4)})">${chip('≈ 32,000 N',0,0,'#E8463C',60)}</g>`;
  if(ck>0.9) s+=`<g transform="translate(1500,300) scale(${pop(t,T.b2+6.8,0.4)})">${txt('= PUSHING 3 CARS',0,0,72,'#FFC21F')}</g>`;
  return s;}

// S4: map – can't turn the corner
function s4(t){
  const t0=S[3][0]; let s=bgPanel('#A6E39A','#86D17C');
  // camera zooms out over the map
  const zo=ease(seg(t,T.b4+0.6,T.b5+0.2)); const zoom=lerp(1.0,0.42,zo);
  let m='';
  // town grid
  for(let i=-2;i<6;i++){m+=`<rect x="${i*300}" y="-400" width="40" height="2400" fill="#F2EEF8" stroke="${INK}" stroke-width="4"/>`;}
  for(let j=-1;j<6;j++){m+=`<rect x="-700" y="${j*300}" width="2600" height="40" fill="#F2EEF8" stroke="${INK}" stroke-width="4"/>`;}
  for(let i=-2;i<5;i++)for(let j=-1;j<5;j++){m+=`<rect x="${i*300+60}" y="${j*300+60}" width="220" height="220" rx="16" fill="${['#FFC9B8','#FFF0C2','#BFE8D2','#D8CCFF'][(i+j+8)%4]}" stroke="${INK}" stroke-width="5"/>`;}
  // Dex's house marker
  m+=`<rect x="380" y="660" width="120" height="120" rx="12" fill="#FFE7B8" stroke="${INK}" stroke-width="6"/><text x="440" y="740" text-anchor="middle" font-family="Lilita One" font-size="60" fill="${INK}">1</text>`;
  // TURN LEFT sign at junction (920, 620)
  m+=`<g transform="translate(980,560)"><rect x="-6" y="0" width="12" height="80" fill="#3A3F66"/><rect x="-110" y="-60" width="220" height="70" rx="12" fill="#3D8BFF" stroke="${INK}" stroke-width="6"/><text x="0" y="-12" text-anchor="middle" font-family="Lilita One" font-size="40" fill="#fff">← TURN LEFT</text></g>`;
  // intended path (dashed) and actual huge arc
  m+=`<path d="M520,620 L920,620 L920,200" fill="none" stroke="#3D8BFF" stroke-width="12" stroke-dasharray="20 18" stroke-linecap="round" opacity="${seg(t,T.b4,T.b4+0.6)*0.8}"/>`;
  const R=3000; const arcK=seg(t,T.b4+0.8,T.b5+0.4);
  const pts=[]; for(let i=0;i<=60;i++){const a=(i/60)*arcK*1.25; const px=520+Math.sin(a)*R, py=620-(1-Math.cos(a))*R; pts.push([px,py]);}
  const startK=seg(t,T.b3+1.0,T.b4+0.8); const sx=lerp(520,520,startK);
  if(arcK>0) m+=`<path d="M${pts.map(p=>p.join(',')).join(' L')}" fill="none" stroke="#FFC21F" stroke-width="18" stroke-linecap="round"/><path d="M${pts.map(p=>p.join(',')).join(' L')}" fill="none" stroke="${INK}" stroke-width="4" stroke-dasharray="2 26" stroke-linecap="round"/>`;
  const head=arcK>0?pts[pts.length-1]:[sx,620];
  m+=`<g transform="translate(${head[0]},${head[1]}) scale(${1/zoom})"><circle r="46" fill="#FFC21F" stroke="${INK}" stroke-width="8"/><circle r="70" fill="none" stroke="#FFC21F" stroke-width="6" opacity="${0.5+0.5*Math.sin(t*8)}"/><text y="18" text-anchor="middle" font-family="Lilita One" font-size="48" fill="${INK}">D</text></g>`;
  // next town + hill
  m+=`<path d="M3200,-1600 q500,-500 1000,0 Z" fill="#6CC067" stroke="${INK}" stroke-width="8"/>`;
  m+=`<g transform="translate(3700,-2300)">${[0,1,2,3].map(i=>`<rect x="${i*170-300}" y="-200" width="140" height="200" rx="10" fill="${['#FFC9B8','#D8CCFF','#FFF0C2','#BFE8D2'][i]}" stroke="${INK}" stroke-width="7"/>`).join('')}</g>`;
  const cx=lerp(700,head[0]*0.55+520*0.45,zo), cy=lerp(560,head[1]*0.55+620*0.45,zo);
  s+=`<g transform="translate(960,560) scale(${zoom}) translate(${-cx},${-cy})">${m}</g>`;
  if(t>T.b3+3.0&&t<T.b4){const k=pop(t,T.b3+3.0,0.4); const fr=Math.sin(t*10)*6;
    s+=`<g transform="translate(1520,820) scale(${k*0.85})"><rect x="-300" y="-250" width="600" height="420" rx="30" fill="#fff" stroke="${INK}" stroke-width="8"/>
    <text y="-180" text-anchor="middle" font-family="Lilita One" font-size="48" fill="${INK}">SHOE GRIP</text>
    <rect x="-260" y="70" width="520" height="40" fill="#9A93B2" stroke="${INK}" stroke-width="5"/>
    <path d="M-150,64 Q-160,-30 -60,-40 Q60,-44 140,0 Q170,20 160,64 Z" fill="#fff" stroke="${INK}" stroke-width="7"/><path d="M-150,56 L160,56" stroke="#3D8BFF" stroke-width="10"/>
    <path d="M${-40+fr},130 L${-200+fr},130" stroke="#E8463C" stroke-width="14" stroke-linecap="round"/><path d="M${-200+fr},130 l26,-16 l0,32 Z" fill="#E8463C"/>
    <text x="80" y="148" font-family="Lilita One" font-size="38" fill="#E8463C">≈ 1 g max</text></g>`;}
  if(t>T.b3+4.0&&t<T.b4) s+=`<g transform="translate(960,980) scale(${pop(t,T.b3+4.0,0.4)})">${chip('GRIP LIMIT ≈ 1 g',0,0,'#3D8BFF',44)}</g>`;
  if(t>T.b3+8.2&&t<T.b4) s+=`<g transform="translate(960,140) scale(${pop(t,T.b3+8.2,0.4)})">${chip('TIGHTEST TURN ≈ 24 KM ACROSS',0,0,'#E8463C',48)}</g>`;
  // "Welcome to" sign reveal
  if(t>T.b5){const k=pop(t,T.b5,0.4); let w=bgPanel('#5DB6FF','#C9E9FF')+`<rect y="700" width="1920" height="380" fill="#86D17C" stroke="${INK}" stroke-width="5"/>`;
    w+=`<g transform="translate(1180,700) scale(${k})"><rect x="-10" y="-260" width="20" height="260" fill="#8A5A3B" stroke="${INK}" stroke-width="5"/><rect x="-330" y="-430" width="660" height="200" rx="20" fill="#3FAF6A" stroke="${INK}" stroke-width="9"/><text y="-350" text-anchor="middle" font-family="Lilita One" font-size="62" fill="#fff">WELCOME TO</text><text y="-280" text-anchor="middle" font-family="Lilita One" font-size="62" fill="#FFF1B0">THE NEXT TOWN</text></g>`;
    w+=chibi({x:640,y:930,s:1.25,...DEX,eyes:'open',look:[-10,0],mouth:'o',sweat:true,armF:[150,40],armLen:1.3,handF:'point',armB:[20,-10],tilt:8,flip:true});
    s=w;}
  return s;}

// S5: braking needs 600 m
function s5(t){
  const t0=S[4][0]; const brakeK=seg(t,T.b6+6.0,T.b6+10.5); const v=1-easeOut(brakeK);
  const sc=t*1500*(t<T.b6+6?1:v)+ (t>T.b6+6? 0:0); let s=streetBG(t<T.b6+6?t*1500:(T.b6+6)*1500+easeOut(brakeK)*2400);
  const dx=lerp(900,1100,brakeK);
  if(t>T.b6+6&&v>0.05){for(let i=0;i<6;i++){const a=rad(200+i*14); s+=`<line x1="${dx-30}" y1="915" x2="${dx-30+Math.cos(a)*(60+((t*700+i*50)%80))}" y2="${915+Math.sin(a)*(60+((t*500+i*30)%60))}" stroke="#FFC21F" stroke-width="7" stroke-linecap="round"/>`;}
    s+=`<path d="M0,925 L${dx-40},925" stroke="#2B2F4A" stroke-width="10" opacity=".5"/>`;}
  s+=chibiSide({x:dx,y:905,s:1.35,phase:t<T.b6+6?(t*3.2)%1:0.25,t,expr:'determined',lean:t<T.b6+6?20:lerp(20,-14,easeOut(seg(t,T.b6+6,T.b6+6.5))),wind:v,run:t<T.b6+6?1:0});
  const dist=Math.round(600*easeOut(brakeK));
  s+=`<g transform="translate(1560,200) scale(${pop(t,T.b6+3.5,0.4)})">${chip('SAFE STOP ≈ 10 g',0,0,'#3D8BFF',46)}</g>`;
  if(t>T.b6+6.0) s+=`<g transform="translate(1560,330)">${txt(dist+' m',0,0,110,'#FFFFFF')}</g>`;
  if(t>T.b6+10.5) s+=`<g transform="translate(1560,450) scale(${pop(t,T.b6+10.5,0.3)})">${chip('BRAKING DISTANCE',0,0,'#E8463C',40)}</g>`;
  return s;}

// S6: stop dead -> 6000 g
function s6(t){
  const t0=S[5][0]; let s=bgPanel('#FFE2A8','#FFC9B8');
  s+=`<rect y="760" width="1920" height="320" fill="#E6E1F0" stroke="${INK}" stroke-width="5"/>`;
  // brick wall
  let w=''; for(let r=0;r<12;r++) for(let c=0;c<5;c++){const off=r%2?40:0; w+=`<rect x="${1380+c*80-off}" y="${160+r*50}" width="78" height="48" rx="5" fill="${(r+c)%3?'#E0745A':'#C9604A'}" stroke="${INK}" stroke-width="4"/>`;}
  s+=`<defs><clipPath id="wallc"><rect x="1380" y="160" width="400" height="600"/></clipPath></defs><g clip-path="url(#wallc)">${w}</g><rect x="1380" y="160" width="400" height="600" fill="none" stroke="${INK}" stroke-width="7"/>`;
  const appr=easeOut(seg(t,T.b7,T.b7+2.4)); const frozen=t>T.b7+2.4;
  const dx=lerp(300,1180,appr);
  for(let i=0;i<5;i++) s+=`<line x1="${dx-40}" y1="770" x2="${dx-90-i*30}" y2="${740-i*8}" stroke="#FFC21F" stroke-width="7" stroke-linecap="round" opacity="${appr<1?0.9:0}"/>`;
  s+=chibiSide({x:dx,y:780,s:1.3,phase:0.25,t,expr:'determined',lean:-18,wind:0.4,run:0,mouth:frozen?'o':null});
  if(frozen){ s+=`<rect width="1920" height="1080" fill="#000" opacity="${0.25*seg(t,T.b7+2.4,T.b7+2.6)}"/>`;
    s+=`<g transform="translate(760,280) scale(${pop(t,T.b7+2.5,0.35)}) rotate(-6)"><rect x="-330" y="-120" width="660" height="210" rx="30" fill="#E8463C" stroke="${INK}" stroke-width="10"/>${txt('≈ 6,000 g',0,40,130,'#FFFFFF')}</g>`;}
  // comparison bars
  if(t>T.b8+2.5){const k=easeOut(seg(t,T.b8+2.5,T.b8+4.0)); s+=`<g transform="translate(110,560)"><rect x="-30" y="-60" width="1000" height="230" rx="30" fill="#fff" stroke="${INK}" stroke-width="7" opacity=".95"/>
     <text x="0" y="0" font-family="Lilita One" font-size="44" fill="${INK}">FIGHTER PILOT LIMIT ≈ 9 g</text><rect x="0" y="18" width="${Math.max(10,11*k)}" height="34" rx="8" fill="#3D8BFF" stroke="${INK}" stroke-width="5"/>
     <text x="0" y="110" font-family="Lilita One" font-size="44" fill="${INK}">STOPPING DEAD ≈ 6,000 g</text><rect x="0" y="128" width="${900*k}" height="34" rx="8" fill="#E8463C" stroke="${INK}" stroke-width="5"/></g>`;}
  return s;}

// S7: rule one
function s7(t){
  const t0=S[6][0]; let s=bgPanel('#5DB6FF','#C9E9FF');
  s+=`<rect y="700" width="1920" height="380" fill="#86D17C" stroke="${INK}" stroke-width="5"/>`;
  // hedge with a Dex-shaped dent
  s+=`<rect x="560" y="420" width="800" height="300" rx="60" fill="#3FAF6A" stroke="${INK}" stroke-width="8"/>`;
  for(let i=0;i<14;i++) s+=`<circle cx="${600+i*56}" cy="${430+(i%2)*14}" r="38" fill="#4FC27A" stroke="${INK}" stroke-width="6"/>`;
  s+=`<path d="M900,700 L900,560 Q900,470 960,470 Q1020,470 1020,560 L1020,700 Z" fill="#1E6B3C" opacity=".85"/><circle cx="960" cy="470" r="62" fill="#1E6B3C" opacity=".85"/>`;
  const out=easeOut(seg(t,t0+0.3,t0+1.6));
  for(let i=0;i<6;i++){const a=rad(-150+i*25); const r=80+60*out; s+=`<ellipse cx="${960+Math.cos(a)*r}" cy="${560+Math.sin(a)*r}" rx="12" ry="6" fill="#4FC27A" stroke="${INK}" stroke-width="3" transform="rotate(${i*30},${960+Math.cos(a)*r},${560+Math.sin(a)*r})" opacity="${1-seg(t,t0+1.6,t0+2.4)}"/>`;}
  s+=chibi({x:lerp(960,1250,out),y:lerp(760,960,out),s:1.15,...DEX,eyes:out<1?'closed':'open',mouth:out<1?'flat':'smile',sweat:true,tilt:lerp(-20,0,out),armF:[-30,20],armB:[30,-20]});
  // leaf on head
  s+=`<ellipse cx="${lerp(960,1250,out)+30}" cy="${lerp(760,960,out)-330}" rx="18" ry="9" fill="#4FC27A" stroke="${INK}" stroke-width="3" transform="rotate(30,${lerp(960,1250,out)+30},${lerp(760,960,out)-330})"/>`;
  // sticky note slaps on
  const nk=pop(t,T.b9+1.4,0.35);
  s+=`<g transform="translate(480,300) scale(${nk}) rotate(-5)"><rect x="-260" y="-150" width="520" height="300" fill="#FFF07A" stroke="${INK}" stroke-width="7"/><rect x="-70" y="-176" width="140" height="44" fill="#BFE6FF" opacity=".85" transform="rotate(-4)"/>
   <text y="-50" text-anchor="middle" font-family="Lilita One" font-size="64" fill="#E8463C">RULE 1</text><text y="30" text-anchor="middle" font-family="Lilita One" font-size="52" fill="${INK}">SLOW DOWN</text><text y="92" text-anchor="middle" font-family="Lilita One" font-size="52" fill="${INK}">SLOWLY</text></g>`;
  return s;}

function render(t){
  let s=DEFS; const F=[s1,s2,s3,s4,s5,s6,s7];
  for(let i=0;i<S.length;i++){ if(t<S[i][1]||i===S.length-1){ s+=F[i](t); break; } }
  for(let i=0;i<S.length-1;i++) s+=wipe(t,S[i][1]);
  const fi=1-seg(t,0,0.3); if(fi>0) s+=`<rect width="1920" height="1080" fill="#000" opacity="${fi}"/>`;
  const fo=seg(t,T.end-0.5,T.end); if(fo>0) s+=`<rect width="1920" height="1080" fill="#000" opacity="${fo}"/>`;
  document.getElementById('root').innerHTML=s;
}
